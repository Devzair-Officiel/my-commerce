---
# Production environment override
services:
  php:
    build:
      context: .
      target: frankenphp_prod
    env_file:
      - path: .env.prod.local
        required: false
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}

  messenger-worker:
    env_file:
      - path: .env.prod.local
        required: false
    environment:
      APP_ENV: prod

  database:
    env_file:
      - .env
      - path: .env.prod.local
        required: false
