---
# Production environment override
services:
  php:
    build:
      context: .
      target: frankenphp_prod
    env_file:
      - path: .env.prod.local
        required: false
    environment:
      APP_ENV: prod
      SERVER_NAME: "nidemiel.com"
    volumes:
      - uploads_data:/app/public/assets/images
      - videos_data:/app/public/assets/videos

  messenger-worker:
    env_file:
      - path: .env.prod.local
        required: false
    environment:
      APP_ENV: prod

  database:
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
      - path: .env.prod.local
        required: false

  netdata:
    image: netdata/netdata:stable
    restart: unless-stopped
    pid: host
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      # Accès protégé par mot de passe — définir NETDATA_PASSWORD dans .env.prod.local
      NETDATA_CLAIM_TOKEN: ""
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  uploads_data:
  videos_data:
  netdata_config:
  netdata_lib:
  netdata_cache:
