# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    upload_dir_products: '%kernel.project_dir%/public/assets/images/products'
    upload_dir_categories: '%kernel.project_dir%/public/assets/images/categories'
    upload_dir_sliders: '%kernel.project_dir%/public/assets/images/sliders'
    upload_dir_settings: '%kernel.project_dir%/public/assets/images/setting'
    upload_dir_blogs: '%kernel.project_dir%/public/assets/images/blogs'
    upload_dir_PaymentMethod: '%kernel.project_dir%/public/assets/images/payment_methods_logos'

    stripe.webhook_secret: '%env(STRIPE_WEBHOOK_SECRET)%'

    colissimo.login:         '%env(COLISSIMO_LOGIN)%'
    colissimo.password:      '%env(COLISSIMO_PASSWORD)%'
    colissimo.sender_name:   '%env(COLISSIMO_SENDER_NAME)%'
    colissimo.sender_street: '%env(COLISSIMO_SENDER_STREET)%'
    colissimo.sender_zip:    '%env(COLISSIMO_SENDER_ZIP)%'
    colissimo.sender_city:   '%env(COLISSIMO_SENDER_CITY)%'

    app.free_shipping_threshold_cents: 5000

    app.mail_from_address: '%env(MAILER_FROM_ADDRESS)%'
    app.mail_from_name: '%env(MAILER_FROM_NAME)%'
    app.site_name: '%env(APP_SITE_NAME)%'
    app.admin_email: '%env(ADMIN_EMAIL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $publicDir: '%kernel.project_dir%/public'
            string $mailFromAddress: '%app.mail_from_address%'
            string $mailFromName: '%app.mail_from_name%'
            string $adminEmail: '%app.admin_email%'
            string $brandName: '%app.site_name%'
            string $uploadDirProducts: '%upload_dir_products%'
            string $uploadDirCategories: '%upload_dir_categories%'
            string $uploadDirSliders: '%upload_dir_sliders%'
            string $uploadDirSettings: '%upload_dir_settings%'
            string $uploadDirBlogs: '%upload_dir_blogs%'
            string $uploadDirPaymentMethod: '%upload_dir_PaymentMethod%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Storefront\StorefrontGlobalsProvider:
        arguments:
            $cacheStorefront: '@cache.storefront'

    App\Twig\StorefrontGlobalsExtension:
        tags: ['twig.extension']

    App\EventListener\StorefrontGlobalsCacheInvalidationListener:
        autowire: true
        autoconfigure: false
        tags:
        - { name: doctrine.event_listener, event: onFlush }
        - { name: doctrine.event_listener, event: postFlush }
          
    App\Service\PaymentConfigResolver:
        arguments:
            $appEnv: '%kernel.environment%'
            $stripePublicProd: '%env(string:default::STRIPE_PUBLIC_KEY)%'
            $stripeSecretProd: '%env(string:default::STRIPE_SECRET_KEY)%'

    App\Service\CartService:
        arguments:
            $freeShippingThresholdCents: '%app.free_shipping_threshold_cents%'

    App\Controller\Webhook\StripeWebhookController:
        arguments:
            $stripeWebhookSecret: '%stripe.webhook_secret%'
    
    App\Controller\Admin\Dashboard\DashboardMetricsProvider: ~

    App\Service\Carrier\ColissimoClient:
        arguments:
            $login:        '%colissimo.login%'
            $password:     '%colissimo.password%'
            $senderName:   '%colissimo.sender_name%'
            $senderStreet: '%colissimo.sender_street%'
            $senderZip:    '%colissimo.sender_zip%'
            $senderCity:   '%colissimo.sender_city%'


